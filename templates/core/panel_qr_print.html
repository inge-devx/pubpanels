<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>QR Code - {{ panel.reference }}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .qr-print-image {
            width: 70vmin;
            height: 70vmin;
            max-width: 600px;
            max-height: 600px;
        }
        .qr-print-reference {
            font-size: 28px;
            font-weight: 700;
            margin-top: 20px;
        }
        .qr-print-hint {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
        }
        .qr-print-actions {
            margin-top: 30px;
        }
        .qr-print-actions button {
            font-size: 16px;
            padding: 10px 20px;
            cursor: pointer;
        }
        @media print {
            .qr-print-actions {
                display: none;
            }
            body {
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <img class="qr-print-image" src="{% url 'panel_qr_code_image' panel.id %}" alt="QR Code {{ panel.reference }}">
    <div class="qr-print-reference">{{ panel.reference }}</div>
    <div class="qr-print-hint">Scannez pour voir la disponibilité de ce panneau</div>

    <div class="qr-print-actions">
        <button onclick="window.print()">Imprimer</button>
    </div>
</body>
</html>
